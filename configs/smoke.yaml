# ============================================================================
# SMOKE configuration: code-path validation only.
# Uses a tiny subsample of reference/query cells and 1-2 epochs.
# Outputs are tagged "smoke" and MUST NOT be used for scientific conclusions,
# committed to results/metrics, or used to render figures/.
# Synthetic AnnData (generated in tests) is allowed for unit tests but its
# outputs never enter results/.
# ============================================================================

experiment_name: heart_donor_holdout
run_tag: smoke
seed: 0
dataset: heart_cell_atlas_subsampled
dataset_loader: scvi.data.heart_cell_atlas_subsampled
remove_nuisance_clusters: true
data_save_path: data/raw

donor_key: donor
batch_key: donor
cell_type_key: cell_type
counts_layer: counts
unlabeled_category: Unknown

# Smoke still runs the REAL deterministic donor rule on the real metadata
# (so split code paths are exercised honestly), but cells are downsampled.
n_hvg: 200
hvg_flavor: seurat_v3

query_selection_rule: largest_eligible_donor
minimum_query_cells: 50
minimum_query_cell_types: 3
exclude_labels: ["doublets", "NotAssigned"]

# Keep the smoke split tiny but stratified by cell type.
smoke_reference_max_cells: 600
smoke_query_max_cells: 300

accelerator: cpu
devices: 1

baseline:
  method: pca_knn
  n_components: 10
  n_neighbors: 5
  weights: distance
  metric: euclidean
  target_sum: 10000.0

scvi:
  n_latent: 10
  n_hidden: 32
  n_layers: 1
  dropout_rate: 0.1
  use_layer_norm: both
  use_batch_norm: none
  encode_covariates: true
  gene_likelihood: zinb
  max_epochs: 2
  early_stopping: false
  check_val_every_n_epoch: 1
  train_size: 0.9
  batch_size: 128

scanvi:
  max_epochs: 2
  n_samples_per_label: 20
  early_stopping: false
  check_val_every_n_epoch: 1

query_mapping:
  max_epochs: 2
  weight_decay: 0.0
  early_stopping: false
  check_val_every_n_epoch: 1

confidence_thresholds: [0.0, 0.5, 0.9]
evaluable_class_min_support: 5

umap:
  n_neighbors: 10
  min_dist: 0.3
  seed: 0
figure_dpi: 100
