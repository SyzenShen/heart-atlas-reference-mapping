[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heartmap"
version = "0.1.0"
description = "Donor-held-out reference mapping of the Human Heart Cell Atlas with scVI, scANVI and scArches"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [{ name = "heart-atlas-reference-mapping contributors" }]
dependencies = [
    "scvi-tools==1.3.3",
    "scanpy>=1.11,<1.12",
    "numpy>=1.24,<2.0",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "h5py",
]

[project.optional-dependencies]
test = ["pytest", "nbformat"]
notebook = ["jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
